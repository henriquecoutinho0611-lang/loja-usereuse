

spring:
  config:
    import: "optional:file:./Back-end/.env[.properties]"
  application:
    name: backend-usereuser
  datasource:
    url: "jdbc:postgresql://localhost:${DB_PORTA}/${DB_NAME}"
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

server:
  port: ${SERVER_PORT:8443}
  ssl:
    enabled: true
    key-store: ${SERVER_SSL_KEY_STORE:file:./Back-end/secrets/localhost.p12}
    key-store-password: ${SERVER_SSL_KEY_STORE_PASSWORD:changeit}
    key-store-type: PKCS12
    key-alias: localhost

app:
  jwt:
    secret: ${JWT_SECRET:local-only-change-this-secret-before-production-32chars}
    ttl-seconds: ${JWT_TTL_SECONDS:3600}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost:5173,http://127.0.0.1:5173}
  merchant:
    name: ${STORE_MERCHANT_NAME:}
    email: ${STORE_MERCHANT_EMAIL:}
    cpf: ${STORE_MERCHANT_CPF:}
    password: ${STORE_MERCHANT_PASSWORD:}
    reset-password: ${STORE_MERCHANT_RESET_PASSWORD:false}
  demo-data:
    enabled: ${APP_DEMO_DATA_ENABLED:false}
  images:
    local-directory: ${IMAGE_STORAGE_DIR:./uploads/products}
  shipping:
    sao-paulo-capital-price: ${SHIPPING_SAO_PAULO_CAPITAL_PRICE:}
    sao-paulo-state-price: ${SHIPPING_SAO_PAULO_STATE_PRICE:}
  payments:
    itau:
      enabled: ${ITAU_PAYMENT_ENABLED:false}
      base-url: ${ITAU_API_BASE_URL:}
      client-id: ${ITAU_CLIENT_ID:}
      client-secret: ${ITAU_CLIENT_SECRET:}
